generated: '2026-07-20'
method: searched
status: published
source:
- https://kb.pigment.com/docs/mcp-server-1.md
- https://kb.pigment.com/docs/connect-common-mcp-clients.md
- https://www.pigment.com/ai/mcp-server
- https://github.com/gopigment/ai-plugins
server:
  name: pigment
  transport: http
  url_pattern: https://pigment.app/api/mcp/public/{id}
  hosted: true
  per_workspace: true
  notes: A unique MCP endpoint URL is generated per Workspace (and per Test & Deploy environment) under
    Settings > Integrations > MCP. Requires Pigment AI to be activated and a Security/Workspace Administrator
    or Primary Owner to enable.
auth:
  type: oauth
  versions:
  - OAuth 2.0
  - OAuth 2.1
  dynamic_client_registration: true
  notes: Clients leave OAuth Client ID/Secret empty; Pigment handles OAuth automatically and whitelists
    per-client callback URLs. Users authenticate with their Pigment credentials and inherit their existing
    access rights. Only Metric data of type Number, Integer, or Boolean can be read via MCP, and Blocks
    can be excluded by disabling their AI data access setting.
supported_clients:
- ChatGPT
- Claude
- Claude Code
- Cursor
- Google Gemini CLI
- Microsoft Copilot
- Mistral (Le Chat)
- Dust
- n8n
- Zapier
official_plugins:
  repo: https://github.com/gopigment/ai-plugins
  claude_marketplace: pigment@claude-plugins-official
  bundles_skills: true
  ref: skills/_index.yml
tools:
  note: Tools are surfaced dynamically per Workspace/permissions and are not published as a static list.
    Documented capabilities include querying governed business metrics and hierarchies, retrieving insights,
    and (modeler agent) Performance Insights tools such as performance_profile_change and get_top_blocks_by_performance.
deployment:
  mode: remote
  endpoint: https://pigment.app/api/mcp/public/{id}
  verified: probed
  probe: gated
  checked: '2026-08-12'
  source: catalog MCP census
