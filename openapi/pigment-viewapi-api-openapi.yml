openapi: 3.2.0
info:
  title: Pigment External View API
  version: v1-external
security:
- ApiKey: []
tags:
- name: ViewApi
paths:
  /api/v1/views:
    get:
      tags:
      - ViewApi
      description: Retrieve metadata for views on the given block
      parameters:
      - name: applicationId
        in: query
        schema:
          type: string
          format: uuid
      - name: blockId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Views metadata retrieval succeeded
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewMetadata'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewMetadata'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewMetadata'
        '401':
          description: Unauthorized
      summary: Get api views
      x-summary-source: derived
      operationId: getApiV1Views
      x-operation-id-source: derived
components:
  schemas:
    ViewMetadataType:
      enum:
      - Public
      - Personal
      type: string
    ViewMetadata:
      required:
      - id
      - name
      - type
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          allOf:
          - $ref: '#/components/schemas/ViewMetadataType'
      additionalProperties: false
  securitySchemes:
    ApiKey:
      type: http
      description: API Key Authorization header using the Bearer scheme.
      scheme: bearer
      bearerFormat: ApiKey
