name: Pigment
description: >-
  Pigment is an enterprise business planning platform (FP&A, workforce, sales, and
  supply-chain planning, and financial consolidation) that exposes a public REST API.
  The Pigment External API (OpenAPI 3.0.4, v1-external) covers CSV and Looker imports,
  CSV exports of Metric/List/Table Views, application/block/view metadata, import
  triggering and status, plus a SCIM 2.0 user-management API and an Enterprise Audit
  Logs API. Pigment also operates an official remote Model Context Protocol (MCP)
  server for AI clients and publishes domain-knowledge Agent Skills. Authentication is
  via Bearer API keys (typed Import/Export/Metadata/SCIM/Audit) with IP allow lists.
